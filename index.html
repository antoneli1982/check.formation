:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}

header{background:var(--bar);color:#fff;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5}

const nowH=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60};

function resize(){const st=R.renderer.domElement.parentElement;if(!st)return;const w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;R.renderer.setSize(w,h,false);R.camera.aspect=w/h;
  R.camera.fov=w/h<1.3?46:36;R.camera.updateProjectionMatrix()}
let running=false,frame=0,last=0;
function loop(t){if(!R.renderer.domElement.isConnected){running=false;return}requestAnimationFrame(loop);if(document.hidden||!R.visible)return;
  const dt=Math.min(.05,(t-(last||t))/1000);last=t;frame++;
  R.rot.forEach(([o,ax,sp])=>o.rotation[ax]+=sp*dt);
  const p=R.ptr;p.x+=(p.tx-p.x)*.05;p.y+=(p.ty-p.y)*.05;const s=Math.sin(t*.00006)*.035;
  const c=R.camBase.clone().applyAxisAngle(new THREE.Vector3(0,1,0),s+p.x*.08);c.y+=p.y*-3;R.camera.position.copy(c);R.camera.lookAt(R.look);
  if(frame%45===0)R.renderer.shadowMap.needsUpdate=true;
  R.renderer.render(R.scene,R.camera)}
async function mount(){const st=document.getElementById('stage');if(!st)return;
  try{if(!R){if(!building)building=build();await building;R.renderer.shadowMap.autoUpdate=false;
      new ResizeObserver(()=>resize()).observe(document.documentElement);setInterval(()=>{if(todMode==='now')setTime(nowH())},60000)}
  }catch(e){console.warn('3D indisponível',e);document.getElementById('stage')?.classList.add('off');return}
  const st2=document.getElementById('stage');if(!st2)return;const cv=R.renderer.domElement;cv.className='gl';st2.appendChild(cv);
  if(R.io)R.io.disconnect();R.io=new IntersectionObserver(es=>{R.visible=es[0].isIntersecting});R.io.observe(cv);R.visible=true;
  new ResizeObserver(resize).observe(st2);resize();setTime(todMode==='now'?nowH():+todMode);
  st2.onpointermove=e=>{const b=st2.getBoundingClientRect();R.ptr.tx=(e.clientX-b.left)/b.width*2-1;R.ptr.ty=(e.clientY-b.top)/b.height*2-1};st2.onpointerleave=()=>{R.ptr.tx=R.ptr.ty=0};
  requestAnimationFrame(()=>st2.classList.add('ready'));if(!running){running=true;last=0;requestAnimationFrame(loop)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tod]');if(!b)return;todMode=b.dataset.tod;setTime(todMode==='now'?nowH():+todMode)});
if(!document.documentElement.classList.contains('no3d')){window.cfMount3D=mount;mount()}

</script>

<script>
{
const TEMPLATE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const STATE_RE=/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* Guia detalhado de cada atividade: base das respostas da Dona Formatione. Entra na tarefa (campo "guia") e pode ser editado na aba Tarefas. */
const GUIAS={"Conferir EPIs da equipe (luvas, botina, óculos, protetor auricular)":{"kw":["epi","capacete","mascara","uniforme","equipamento de protecao"],"g":"Para que serve: EPI é o equipamento que protege o corpo. Sem ele, um acidente pequeno vira machucado grave. Por isso se confere antes de começar o serviço.\nComo fazer:\n1. Faça no começo do turno, antes de alguém ir para o pátio ou o galpão.\n2. Olhe pessoa por pessoa, de perto. Confira o seu também.\n3. Luvas: nas mãos, sem rasgo e sem furo.\n4. Botina: nos pés, fechada, com a sola inteira.\n5. Óculos: nos olhos (não na testa), sem lente quebrada ou muito riscada.\n6. Protetor auricular: no ouvido de quem trabalha perto de máquina ou caminhão.\n7. Faltou ou está estragado? A pessoa troca antes de começar. Sem EPI, não começa o serviço.\nNão marque se: alguém ficou trabalhando sem EPI. Avise o sênior na hora.\nO que escrever na observação: quem estava sem o quê e o que foi feito. Estava tudo certo? Escreva \"Todos com EPI completo\".\nExemplo de observação: \"Ajudante novo sem protetor auricular. Entreguei um novo antes de começar.\""},"Verificar extintores e rota de fuga do pátio":{"kw":["extintor","rota de fuga","saida de emergencia"],"g":"Para que serve: o extintor apaga o começo de um incêndio. A rota de fuga é o caminho para sair rápido numa emergência. Os dois têm de estar prontos antes de alguém precisar.\nComo fazer:\n1. Passe por todos os extintores do pátio, um por um.\n2. Lacre: o pino tem de estar preso pelo lacre inteiro.\n3. Pressão: o ponteiro do reloginho tem de estar na faixa verde. Extintor de CO2 não tem reloginho: nele, confira o lacre e a etiqueta.\n4. Validade: olhe a etiqueta. A data não pode estar vencida.\n5. Veja se o extintor está no lugar dele, com a placa, sem amassado e com a mangueira inteira.\n6. Nada na frente: palete, caçamba ou caixa não podem tampar o extintor.\n7. Ande pela rota de fuga inteira, até a saída. O caminho tem de estar livre e a saída tem de abrir.\n8. Tem coisa leve no caminho? Tire na hora e anote.\nNão marque se: há extintor vencido, sem lacre ou com o ponteiro fora do verde, ou rota de fuga travada que você não conseguiu liberar. Avise o sênior.\nO que escrever na observação: qual extintor, onde fica e qual é o problema. Vai vencer no mês que vem? Anote também.\nExemplo de observação: \"Extintor B2 com lacre rompido. Pedi a troca ao sênior.\""},"Inspeção pré-uso dos caminhões roll-on e poliguindaste":{"kw":["pneu","freio","guindaste","veiculo","roll-on","rollon"],"g":"Para que serve: achar o defeito no pátio, antes de o caminhão ir para a rua com carga. Falha de freio, cabo ou gancho com caçamba pesada causa acidente grave.\nComo fazer:\n1. Faça em cada caminhão que vai sair hoje, antes da primeira viagem, com ele parado e freado.\n2. Pneus: cheios, sem corte, sem bolha, com desenho na borracha e com todas as porcas da roda.\n3. Olhe o chão embaixo do caminhão: não pode ter mancha nova de óleo.\n4. Óleo: confira o nível do óleo do motor e do óleo hidráulico (o que move o braço).\n5. Freios: teste o pedal e o freio de mão antes de sair do lugar.\n6. Cabos de aço e correntes: sem fio partido, sem amassado e sem ferrugem forte.\n7. Ganchos: sem trinca, sem estar abertos e com a trava funcionando.\n8. Braço e mangueiras: sem vazamento. Suba e desça o braço uma vez, sem carga.\n9. Luzes, setas, buzina e alarme de ré funcionando.\nNão marque se: achou problema em freio, pneu, cabo, gancho ou vazamento. Esse caminhão não sai. Avise o sênior.\nO que escrever na observação: o número do caminhão e o que achou, mesmo que pareça pequeno.\nExemplo de observação: \"Roll-on 04: pneu traseiro com desgaste. Avisei o sênior, troca agendada.\""},"Aferir balança rodoviária com peso-padrão":{"kw":["pesagem","peso padrao","calibr"],"g":"Para que serve: conferir se a balança pesa certo. Balança errada faz a empresa cobrar ou pagar errado, e o peso que vai no documento da carga sai errado.\nComo fazer:\n1. Faça antes da primeira pesagem do dia.\n2. Veja se a plataforma está limpa e solta: sem pedra, barro ou material preso embaixo ou nas bordas.\n3. Com a balança vazia, o visor tem de marcar zero.\n4. Coloque o peso-padrão na plataforma. É o peso de teste, que tem o valor conhecido.\n5. Espere o número parar e leia.\n6. Compare com o valor do peso-padrão. A diferença tem de ficar dentro da tolerância que o sênior passou. Não sabe qual é? Pergunte a ele.\n7. Tire o peso e veja se o visor volta para zero.\nNão marque se: a balança não zera ou a diferença passou da tolerância. Não pese cargas e avise o sênior para chamar o técnico.\nO que escrever na observação: sempre os dois números, o do peso-padrão e o que a balança marcou.\nExemplo de observação: \"Peso-padrão 1.000 kg. A balança marcou 1.020 kg. Diferença de 20 kg, sênior avisado.\""},"Emitir e conferir MTRs das coletas do dia":{"kw":["manifesto","sinir","cetesb","cadri"],"g":"Para que serve: o MTR é o documento que acompanha o resíduo no caminhão. Ele diz o que é, de quem é, quem leva e para onde vai. Sem o MTR certo, a carga não pode sair e a empresa pode ser multada.\nComo fazer:\n1. Pegue a lista das coletas programadas para hoje.\n2. Para cada coleta, emita o MTR no sistema (SINIR ou CETESB) antes de o caminhão sair.\n3. Confira o gerador: o cliente de onde o resíduo sai.\n4. Confira o transportador, a placa do caminhão e o motorista.\n5. Confira o destinador: o lugar para onde o resíduo vai.\n6. Confira o tipo de resíduo, a classe e a quantidade. Tem de bater com a carga de verdade.\n7. Faltou documento do cliente (por exemplo, o CADRI, quando for exigido)? Não emita por conta própria. Pergunte ao sênior.\n8. Entregue o MTR ao motorista antes da saída.\n9. No fim, conte: o número de MTRs tem de ser igual ao número de coletas do dia.\nNão marque se: alguma coleta ficou sem MTR ou com dado errado. Essa carga não sai. Sistema fora do ar? Avise o sênior; a carga espera.\nO que escrever na observação: coleta reagendada, MTR corrigido ou sistema fora do ar, com o nome do cliente e a hora.\nExemplo de observação: \"Sistema fora do ar das 8h às 9h. Avisei o sênior. O MTR foi emitido antes de a carga sair.\""},"Conferir segregação na área de triagem":{"kw":["triagem","baia","separacao","separar","mistur","classe ii","classe 2"],"g":"Para que serve: cada resíduo tem o seu lugar. Misturado, o material não pode ser reciclado. E resíduo perigoso no meio do comum contamina tudo e pode causar acidente.\nComo fazer:\n1. Ande por todas as baias da triagem. Baia é o espaço separado para cada material.\n2. Cada baia tem de ter uma placa com o nome do material, fácil de ler.\n3. Olhe dentro: só pode ter o material da placa.\n4. Classe I é o resíduo perigoso: óleo, tinta, solvente, pilha, lâmpada, embalagem suja de produto químico. Fica no lugar próprio dele, nunca junto do resto.\n5. Classe II é o resíduo comum: papel, plástico, metal, vidro, madeira.\n6. Nos coletores coloridos: azul é papel, vermelho é plástico, amarelo é metal, verde é vidro.\n7. Material comum no lugar errado? Leve para a baia certa.\n8. Achou resíduo perigoso no meio do comum? Não mexa sem luva e óculos. Avise o sênior.\nNão marque se: há resíduo perigoso misturado com o comum. Avise o sênior.\nO que escrever na observação: qual baia, o que estava errado e o que você fez.\nExemplo de observação: \"Baia de Classe I sem placa de identificação. Avisei o sênior.\""},"Limpeza e organização do galpão":{"kw":["varrer","varricao","limpar","arrumar","faxina"],"g":"Para que serve: galpão sujo e bagunçado causa tropeço, corte e incêndio. Limpo e arrumado, o próximo turno começa seguro.\nComo fazer:\n1. Faça no fim do turno, com as máquinas desligadas.\n2. Recolha os restos de material do chão e leve cada um para a baia certa.\n3. Varra o chão.\n4. Viu óleo ou outro líquido no chão? Cubra com areia ou manta absorvente, recolha e avise o sênior.\n5. Deixe livres os corredores, as saídas, os extintores e os quadros de energia.\n6. Guarde as ferramentas e os equipamentos no lugar.\n7. Deixe as pilhas e os fardos firmes, sem risco de cair.\n8. Dê uma última volta olhando tudo antes de sair.\nNão marque se: ficou parte sem limpar porque não deu tempo ou faltou gente. Escreva o motivo e avise o sênior.\nO que escrever na observação: o que ficou sem fazer e por quê, ou algo quebrado que você viu.\nExemplo de observação: \"Galpão 2 sem varrição por falta de equipe. Avisei o sênior.\""},"Registrar saldo de caçambas no pátio":{"kw":["contagem","contar","quantas cacambas","estoque"],"g":"Para que serve: saber quantas caçambas vazias a empresa tem para atender os clientes amanhã. Com a contagem errada, falta caçamba na hora da entrega.\nComo fazer:\n1. Faça no fim do turno, depois que os caminhões voltaram.\n2. Ande pelo pátio e conte uma por uma. Não conte de cabeça.\n3. Conte separado por tipo e por tamanho.\n4. Como disponível, conte só as vazias e em bom estado.\n5. Conte à parte as quebradas e as que estão no conserto.\n6. Escreva os números na observação. Nesta tarefa, a observação é o próprio registro.\n7. Vai faltar algum tipo para as entregas de amanhã? Escreva e avise o sênior.\nNão marque se: você não contou no pátio hoje. Não copie o número de ontem.\nO que escrever na observação: quantas disponíveis de cada tipo e quantas em manutenção.\nExemplo de observação: \"12 caçambas disponíveis, 4 em manutenção. Falta caçamba de 5 m³ para amanhã.\""},"Verificar vazamentos na área de armazenamento Classe I":{"kw":["classe i","classe 1","tambor","contencao","perigoso","mitigacao"],"g":"Para que serve: Classe I é o resíduo perigoso (óleo, tinta, solvente, produto químico). Se vazar, faz mal às pessoas, contamina o chão e a água, e a empresa pode ser multada.\nComo fazer:\n1. Antes de entrar na área, coloque luvas, óculos e botina.\n2. Olhe o chão em volta e embaixo dos tambores: não pode ter mancha nem poça.\n3. Bacia de contenção: é a bandeja ou mureta que segura o líquido se um tambor vazar. Tem de estar seca e sem rachadura.\n4. Tem água de chuva na bacia? Avise o sênior. Essa água pode estar contaminada e não vai para o ralo.\n5. Tambores: fechados, em pé, sem amassado fundo, sem ferrugem e sem estufar.\n6. Cada tambor com etiqueta dizendo o que tem dentro.\n7. Kit de mitigação (manta absorvente, areia, pá e saco): completo e fácil de pegar.\n8. Veja se a área está coberta, com placa de aviso e sem nada que não é de lá.\nSe achar vazamento: afaste as pessoas, não pise no líquido e avise o sênior na hora. Só segure o vazamento com o kit se você foi treinado e está de EPI.\nNão marque se: há vazamento sem resolver ou o kit está incompleto. Avise o sênior.\nO que escrever na observação: qual tambor, onde, o que viu e o que foi feito.\nExemplo de observação: \"Bacia de contenção com água de chuva. Avisei o sênior e a água foi retirada.\""},"Conferir lacres e identificação das caçambas antes da saída":{"kw":["lacre da cacamba","adesivo","numero da cacamba","rotulo"],"g":"Para que serve: o lacre mostra que ninguém mexeu na carga no caminho. A identificação mostra qual é a caçamba e o que vai dentro. Com os dois certos, a carga bate com o documento e chega ao destino certo.\nComo fazer:\n1. Faça em cada caçamba carregada, antes de o caminhão sair.\n2. Identificação: o número ou adesivo da caçamba tem de estar no lugar e fácil de ler.\n3. Esse número tem de ser o mesmo do documento da carga (MTR ou ordem de coleta).\n4. Caçamba com resíduo perigoso precisa do rótulo próprio. Na dúvida, pergunte ao sênior.\n5. Lacre: tem de estar colocado, inteiro e bem fechado. Puxe de leve para testar.\n6. Se o número do lacre é anotado no documento, confira se é o mesmo.\n7. Veja se a tampa ou a lona está fechada e presa, e se nada escorre ou cai da caçamba.\nNão marque se: há caçamba sem lacre, com lacre rompido ou sem identificação. Ela não sai até corrigir. Avise o sênior.\nO que escrever na observação: o número da caçamba e o que estava errado.\nExemplo de observação: \"Caçamba 37 sem adesivo de identificação. Avisei o sênior antes da saída.\""}};
/* Periodicidade: D diária, S semanal (seg–dom), M mensal, A anual. warn = quantos dias antes do fim do período a tarefa fica vermelha. */
const FREQ={D:{n:'Diária',g:'Diárias',warn:0},S:{n:'Semanal',g:'Semanais',warn:2},M:{n:'Mensal',g:'Mensais',warn:5},A:{n:'Anual',g:'Anuais',warn:30}};
/* Departamentos: cada tarefa pertence a um; cada usuário tem a lista dos que pode acessar. */
function migrate(s){
  if(!Array.isArray(s.depts)||!s.depts.length)s.depts=[{id:'d1',name:'Operação',on:true}];
  const d0=s.depts[0].id,ok=id=>s.depts.some(d=>d.id===id),td={};
  s.tasks.forEach(t=>{if(!ok(t.dept))t.dept=d0;td[t.id]=t.dept;if(!FREQ[t.freq])t.freq='D';const G=GUIAS[t.title];if(G&&t.guia===undefined){t.guia=G.g;t.kw=G.kw}});
  s.users.forEach(u=>{u.depts=Array.isArray(u.depts)?u.depts.filter(ok):[d0]});
  s.records.forEach(r=>{if(!r.dept)r.dept=td[r.task]||d0});
  return s}
let S=migrate(JSON.parse($('#state').textContent));
let art=null,local=false,view=null,filter='Todas',histDay=null,editTask=null,editUser=null,editDept=null,period=14,histOp='',deptSel={};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const fmtDay=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const fmtDM=s=>{const [y,m,d]=s.split('-');return d+'/'+m};
const fmtTime=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))};
const first=n=>String(n).split(' ')[0];
/* ---------- Períodos ---------- */
const fq=t=>FREQ[t?.freq]?t.freq:'D';
const pday=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function perOf(f,day){const d=pday(day),Y=d.getFullYear(),Mo=d.getMonth();let s=d,e=d;
  if(f==='S'){s=new Date(Y,Mo,d.getDate()-(d.getDay()+6)%7);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6)}
  else if(f==='M'){s=new Date(Y,Mo,1);e=new Date(Y,Mo+1,0)}
  else if(f==='A'){s=new Date(Y,0,1);e=new Date(Y,11,31)}
  return {s:ymd(s),e:ymd(e)}}
const recOf=(t,p)=>S.records.find(r=>r.task===t.id&&r.day>=p.s&&r.day<=p.e);
const doneRec=(t,day=today())=>recOf(t,perOf(fq(t),day));
function due(t,day=today()){const f=fq(t),p=perOf(f,day),left=Math.round((pday(p.e)-pday(day))/864e5),w=t.warn??FREQ[f].warn;return {f,p,left,urgent:f!=='D'&&left<=w}}
const bornDay=t=>ymd(new Date(Math.floor((+t.id||0)/1000)));
function endedPeriods(f,start,end){const out=[];let p=perOf(f,start);while(p.e<end){out.push(p);p=perOf(f,addDays(p.e,1))}return out}
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function perLabel(d){const {f,p}=d;if(f==='S')return `semana de ${fmtDM(p.s)} a ${fmtDM(p.e)}`;if(f==='M'){const [y,m]=p.s.split('-');return MESES[+m-1]+'/'+y}if(f==='A')return 'ano de '+p.s.slice(0,4);return fmtDay(p.s)}
const wd=s=>pday(s).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');
const untilTxt=d=>`até ${wd(d.p.e)}, ${fmtDM(d.p.e)}`;
const leftTxt=n=>n<=0?'vence hoje':n===1?'falta 1 dia':`faltam ${n} dias`;
const perHint=t=>{const d=due(t);return d.f==='D'?'':` (${FREQ[d.f].n.toLowerCase()}, ${untilTxt(d)}${d.urgent?' — ⏰ **'+leftTxt(d.left)+'**':''})`};

/* ---------- Sessão ---------- */
let signedProfile = null;
function cur(){return S.users.find(u=>u.id===signedProfile && u.on)||null}
const isSr=()=>cur()?.role==='senior';
const userName=id=>S.users.find(u=>u.id===id)?.name||'—';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
function ask(title,text){return new Promise(r=>{const d=$('#dlgAsk');$('#askT').textContent=title;$('#askP').textContent=text;d.showModal();$('#askYes').onclick=()=>{d.close();r(true)};$('#askNo').onclick=()=>{d.close();r(false)}})}

const tables=['users','tasks','depts','records'];
const snapshots={};
let db, api, authApi, auth, profileKey, baseline, busy=false, connected=false, ready=false;
let accessMessage='Conectando ao Firebase…';
function nextId(){return Date.now()*1000+crypto.getRandomValues(new Uint16Array(1))[0]%1000}
function refreshCloud(){
  if(busy || !ready)return;
  const state={seq:0,cats:Object.values(snapshots.cats||{})};
  for(const table of tables)state[table]=Object.values(snapshots[table]||{}).filter(Boolean).map(row=>structuredClone(row));
  for(const t of state.tasks)t.assign=t.assign||[];
  for(const u of state.users)u.depts=u.depts||[];
  S=migrate(state);
  signedProfile=snapshots.users?.[profileKey]?.id;
  baseline=structuredClone(S);
  if(!cur()){ready=false;accessMessage='Acesso bloqueado. Procure o gestor.'}
  if(!document.querySelector('input:focus,textarea:focus,select:focus') || !cur())render();
}
function keyFor(table,id){return Object.entries(snapshots[table]||{}).find(([,row])=>row?.id===id)?.[0]}
async function save(){
  if(!ready||busy||!connected){toast('Sem conexão ou gravação em andamento. Tente novamente.');refreshCloud();return false}
  const changes={};
  for(const table of tables){
    const prior=new Map(baseline[table].map(row=>[row.id,row]));
    for(const row of S[table]){
      const before=prior.get(row.id);prior.delete(row.id);
      if(!before){
        const key=table==='records'?row.day+'_'+row.task:'id_'+row.id;
        changes[table+'/'+key]=row;
      }else{
        const path=table+'/'+keyFor(table,row.id);
        for(const field of Object.keys(row))if(JSON.stringify(row[field])!==JSON.stringify(before[field]))changes[path+'/'+field]=row[field];
      }
    }
    for(const id of prior.keys())changes[table+'/'+keyFor(table,id)]=null;
  }
  if(JSON.stringify(S.cats)!==JSON.stringify(baseline.cats))changes.cats=S.cats;
  busy=true;document.querySelector('#root').inert=true;toast('Salvando no Firebase…');
  try{await api.update(api.ref(db),changes);toast('Salvo no Firebase');return true}

function greet(){const h=new Date().getHours();return h>=5&&h<12?'Bom dia':h>=12&&h<18?'Boa tarde':'Boa noite'}

/* ---------- Regras ---------- */
const deptName=id=>S.depts.find(d=>d.id===id)?.name||'—';
const deptsOf=u=>S.depts.filter(d=>d.on&&(u.role==='senior'||u.depts.includes(d.id)));
function curDept(u){const ds=deptsOf(u),id=deptSel[u.id]??ls.get('cf-dept-'+u.id,null);return ds.some(d=>d.id===id)?id:ds[0]?.id||null}
function setDept(u,id){deptSel[u.id]=id;ls.set('cf-dept-'+u.id,id)}
const canDo=(t,u)=>t.on&&(u.role==='senior'||(u.depts.includes(t.dept)&&(!t.assign.length||t.assign.includes(u.id))));
const forUser=(t,u)=>t.dept===curDept(u)&&canDo(t,u);
const pendIn=(u,dep)=>S.tasks.filter(t=>t.dept===dep&&canDo(t,u)&&!doneRec(t)).length;
const respLabel=t=>t.assign.length?t.assign.map(userName).map(first).join(', '):'Todos do departamento';
const opDays=dep=>{const s=new Set(S.records.filter(r=>!dep||r.dept===dep).map(r=>r.day));s.add(today());return s};

async function check(id){
  const u=cur();if(!u)return;
  const t=S.tasks.find(x=>x.id===id);if(!t||!forUser(t,u))return;
  if(doneRec(t)){toast(fq(t)==='D'?'Tarefa já registrada hoje':'Tarefa já registrada neste período');return}
  const obs=($('#obs'+id)?.value||'').trim(),at=new Date().toISOString();
  S.records.push({id:nextId(),task:id,dept:t.dept,title:t.title,day:today(),at,uid:u.id,by:u.name,obs});
  if(await save()){const dr=ls.get('cf-drafts',{});delete dr[id];ls.set('cf-drafts',dr)}
}
async function undo(rid){
  if(!isSr())return;const r=S.records.find(x=>x.id===rid);
  if(!await ask('Estornar registro?',`“${r.title}” feito por ${r.by} às ${fmtTime(r.at)} será removido.`))return;
  S.records=S.records.filter(x=>x.id!==rid);await save();
}

/* ---------- Checklist ---------- */
function vChecklist(u){
  const day=today(),act=S.tasks.filter(t=>forUser(t,u));
  const R=new Map(act.map(t=>[t.id,doneRec(t,day)])),DU=new Map(act.map(t=>[t.id,due(t,day)]));
  const isDone=t=>!!R.get(t.id),late=t=>!isDone(t)&&DU.get(t.id).urgent;
  const done=act.filter(isDone).length,pct=act.length?Math.round(done/act.length*100):0;
  const critOpen=act.filter(t=>t.crit&&!isDone(t)&&(fq(t)==='D'||late(t))).length,urg=act.filter(late).length;
  const fs=Object.keys(FREQ).filter(k=>act.some(t=>fq(t)===k));
  const opts=[['Todas','Todas'],['Pendentes','Pendentes'],...(urg?[['Vencendo','⏰ Vencendo ('+urg+')']]:[]),...(fs.length>1?fs.map(k=>['p:'+k,FREQ[k].g]):[]),...S.cats.filter(c=>act.some(t=>t.cat===c)).map(c=>[c,c])];
  if(!opts.some(o=>o[0]===filter))filter='Todas';
  const list=act.filter(t=>filter==='Todas'||(filter==='Pendentes'?!isDone(t):filter==='Vencendo'?late(t):filter.startsWith('p:')?fq(t)===filter.slice(2):t.cat===filter));
  const dr=ls.get('cf-drafts',{}),rank=t=>isDone(t)?2:late(t)?0:1;
  const card=t=>{const r=R.get(t.id),d=DU.get(t.id),lt=late(t),per=d.f!=='D';
   return `<article class="card${r?' done':lt?' late':''}"><button type="button" class="tick" data-check="${t.id}" aria-label="${r?'Concluída':'Marcar como feita'}: ${esc(t.title)}" ${r?'aria-disabled="true"':''}>${r?'<svg width="26" height="26" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</button>
   <h3>${esc(t.title)}${t.crit?'<span class="tag">Crítica</span>':''}${per?`<span class="tag pt">${FREQ[d.f].n} · ${r?esc(perLabel(d)):untilTxt(d)}</span>`:''}${lt?`<span class="tag red">⏰ ${leftTxt(d.left).replace(/^./,c=>c.toUpperCase())}</span>`:''}</h3>
   ${t.desc?`<p class="d">${esc(t.desc)}</p>`:''}
   ${u.role==='senior'?`<p class="resp">Responsável: ${esc(respLabel(t))}</p>`:''}
   ${r?`<p class="sig">✔ <b>${esc(r.by)}</b> · <b>${fmtDay(r.day)} às ${fmtTime(r.at)}</b>${per?` <span style="color:var(--mute)">· próximo preenchimento a partir de ${fmtDM(addDays(d.p.e,1))}</span>`:''}${r.obs?`<q>${esc(r.obs)}</q>`:''}${u.role==='senior'?` <button class="btn danger sm" data-undo="${r.id}" type="button">Estornar</button>`:''}</p>`
      :`<div class="obs"><label for="obs${t.id}" style="font-weight:500">Observação (opcional)</label><textarea id="obs${t.id}" rows="1" maxlength="500" data-draft="${t.id}" placeholder="Ex.: extintor B2 com lacre rompido">${esc(dr[t.id]||'')}</textarea></div>`}
   </article>`};
  const secs=Object.keys(FREQ).map(k=>[k,list.filter(t=>fq(t)===k)]).filter(x=>x[1].length);
  const body=secs.map(([k,ts])=>{const d=due({freq:k},day),lt=ts.some(late);
    return `<h2 class="per${lt?' late':''}">${FREQ[k].g}<small>${k==='D'?fmtDay(day):`${perLabel(d)} · preencher ${untilTxt(d)}`}${lt?' · ⏰ '+leftTxt(d.left):''}</small></h2>`+
     S.cats.map(c=>[c,ts.filter(t=>t.cat===c).sort((a,b)=>rank(a)-rank(b))]).filter(g=>g[1].length).map(([c,g])=>`<h3 class="cat">${esc(c)}</h3>`+g.map(card).join('')).join('')}).join('');
  return `${local?'<div class="banner">Modo local: os registros ficam só neste navegador.</div>':''}
  <section class="meter" aria-label="Progresso do dia"><div class="big">${done}<span>/${act.length}</span></div>
   <div><h2 style="font-size:20px">${u.role==='senior'?'Checklist':'Suas tarefas'} · ${esc(deptName(curDept(u)))}</h2><div class="track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
   <p>${fmtDay(day)} · ${pct}% concluído${critOpen?` · <b style="color:var(--crit)">${critOpen} crítica${critOpen>1?'s':''} pendente${critOpen>1?'s':''}</b>`:act.length?' · nenhuma crítica pendente':''}${urg?` · <b style="color:var(--danger)">⏰ ${urg} vencendo</b>`:''}</p></div></section>
  <div class="filters">${opts.map(([v,l])=>`<button type="button" data-f="${esc(v)}" aria-pressed="${v===filter}">${esc(l)}</button>`).join('')}</div>
  ${!act.length?`<div class="empty">Nenhuma tarefa ${u.role==='senior'?'ativa':'para você'} em ${esc(deptName(curDept(u)))} hoje.</div>`:!secs.length?'<div class="empty">Tudo feito por aqui. Bom trabalho!</div>':''}
  ${body}`;
}

/* ---------- Painel do sênior ---------- */
function vDash(){
  const dep=curDept(cur()),end=today(),start=addDays(end,-(period-1)),od=opDays(dep);
  const days=[];for(let d=start;d<=end;d=addDays(d,1))if(od.has(d))days.push(d);
  const all=S.tasks.filter(t=>t.on&&t.dept===dep),act=all.filter(t=>fq(t)==='D'),per=all.filter(t=>fq(t)!=='D');
  const ops=S.users.filter(u=>u.role==='op'&&u.on&&u.depts.includes(dep));
  const recIn=S.records.filter(r=>r.dept===dep&&r.day>=start&&r.day<=end);
  const done=(t,d)=>S.records.some(r=>r.task===t.id&&r.day===d);
  const series=days.map(d=>{const n=act.filter(t=>done(t,d)).length;return {d,n,pct:act.length?Math.round(n/act.length*100):0}});
  const past=series.filter(s=>s.d!==end),avg=past.length?Math.round(past.reduce((a,s)=>a+s.pct,0)/past.length):0;
  const tday=series.find(s=>s.d===end)||{n:0,pct:0};
  const perMiss=t=>{const ps=endedPeriods(fq(t),start,end).filter(p=>p.e>=bornDay(t));return {of:ps.length,m:ps.filter(p=>!recOf(t,p)).length}};
  const critPend=[...act.filter(t=>t.crit&&!done(t,end)),...per.filter(t=>t.crit&&!doneRec(t,end)&&due(t,end).urgent)];
  const critMiss=past.reduce((a,s)=>a+act.filter(t=>t.crit&&!done(t,s.d)).length,0)+per.filter(t=>t.crit).reduce((a,t)=>a+perMiss(t).m,0);
  const obsN=recIn.filter(r=>r.obs).length;
  const byOp=ops.map(u=>{const mine=act.filter(t=>t.assign.includes(u.id));const exp=mine.length*past.length;const ok=past.reduce((a,s)=>a+mine.filter(t=>done(t,s.d)).length,0);
    const nChecks=recIn.filter(r=>r.uid===u.id).length;const tdMine=all.filter(t=>t.assign.includes(u.id)&&!doneRec(t,end)&&(fq(t)==='D'||due(t,end).urgent)).length;
    return {u,nChecks,pct:exp?Math.round(ok/exp*100):null,pendHoje:tdMine,last:recIn.filter(r=>r.uid===u.id).sort((a,b)=>a.at<b.at?1:-1)[0]}});
  const maxChecks=Math.max(1,...byOp.map(o=>o.nChecks));
  const miss=[...act.map(t=>({t,m:past.filter(s=>!done(t,s.d)).length,of:past.length,un:'dias'})),...per.map(t=>({t,...perMiss(t),un:'períodos'}))].filter(x=>x.m).sort((a,b)=>b.m-a.m).slice(0,5);
  const obs=recIn.filter(r=>r.obs).sort((a,b)=>a.at<b.at?1:-1).slice(0,6);
  const perRows=per.map(t=>({t,r:doneRec(t,end),d:due(t,end)})).sort((a,b)=>(!!a.r-!!b.r)||(a.d.left-b.d.left));
  return `<div class="head"><h2>Painel · ${esc(deptName(dep))}</h2><div class="filters" style="margin:0">${[7,14,30].map(p=>`<button type="button" data-period="${p}" aria-pressed="${p===period}">${p} dias</button>`).join('')}</div></div>
  <div class="kpis">
   <div class="kpi"><small>Hoje · tarefas diárias</small><b>${tday.n}/${act.length}</b><span>${tday.pct}% concluído</span></div>
   <div class="kpi${critPend.length?' warn':''}"><small>Críticas pendentes hoje</small><b>${critPend.length}</b><span>${critPend.length?esc(critPend.slice(0,2).map(t=>t.title.split(' ').slice(0,3).join(' ')).join('; '))+(critPend.length>2?'…':''):'tudo em dia'}</span></div>
   <div class="kpi"><small>Conformidade média</small><b>${avg}%</b><span>${past.length} dias operados antes de hoje</span></div>
   <div class="kpi${critMiss?' warn':''}"><small>Críticas não feitas</small><b>${critMiss}</b><span>${obsN} observações no período</span></div>
  </div>
  <div class="dgrid">
   <section class="panel"><h3>Conclusão diária do checklist</h3>
    <div class="cols" role="img" aria-label="Percentual de tarefas diárias concluídas por dia">${series.map(s=>`<div class="col${s.pct<80?' low':''}" tabindex="0"><em>${s.pct}%</em><i style="height:${Math.max(s.pct,1)}%"></i><span class="tip">${fmtDay(s.d)}${s.d===end?' (hoje)':''}: ${s.n} de ${act.length} · ${s.pct}%</span></div>`).join('')}</div>
    <div class="xl">${series.map(s=>`<span>${s.d===end?'Hoje':fmtDM(s.d)}</span>`).join('')}</div>
    <p class="note">Só tarefas diárias. Barras em âmbar: dias abaixo de 80% de conclusão. Dias sem nenhum registro neste departamento não aparecem.</p></section>
   <section class="panel"><h3>Tarefas semanais, mensais e anuais</h3>
    ${perRows.length?perRows.map(({t,r,d})=>`<div class="trow"><div><b>${esc(t.title)}</b> <span class="tag pt">${FREQ[d.f].n}</span>${t.crit?' <span class="tag">Crítica</span>':''}${!r&&d.urgent?` <span class="tag red">⏰ ${leftTxt(d.left)}</span>`:''}
     <div class="resp">${esc(perLabel(d))} · ${r?`✔ ${esc(r.by)} em ${fmtDM(r.day)} ${fmtTime(r.at)}`:`pendente, ${untilTxt(d)}`} · ${esc(respLabel(t))}</div></div></div>`).join(''):'<p class="note">Nenhuma tarefa semanal, mensal ou anual neste departamento.</p>'}
   </section>
   <section class="panel"><h3>Desempenho por operador</h3>
    ${byOp.map(o=>`<div class="hbar${o.pct!=null&&o.pct<85?' warn':''}" title="${esc(o.u.name)}: ${o.nChecks} checks no período"><span class="n">${esc(o.u.name)}</span><span class="tr"><i style="width:${o.nChecks/maxChecks*100}%"></i></span><b>${o.nChecks} checks</b></div>
     <p class="note" style="margin:-2px 0 8px">${o.pct!=null?`Conformidade nas tarefas diárias atribuídas: <b>${o.pct}%</b>`:'Sem tarefas diárias exclusivas'} · ${o.pendHoje?`<span style="color:var(--crit)">${o.pendHoje} pendente${o.pendHoje>1?'s':''} hoje</span>`:'em dia hoje'}${o.last?` · último check ${fmtDM(o.last.day)} ${fmtTime(o.last.at)}`:''}</p>`).join('')||'<p class="note">Nenhum operador ativo neste departamento.</p>'}
   </section>
   <section class="panel"><h3>Tarefas que mais ficaram sem fazer</h3>
    ${miss.length?miss.map(x=>`<div class="hbar${x.t.crit?' warn':''}"><span class="n" title="${esc(x.t.title)}">${esc(x.t.title)}</span><span class="tr"><i style="width:${x.m/Math.max(1,x.of)*100}%"></i></span><b>${x.m} de ${x.of} ${x.un}</b></div>`).join('')+'<p class="note">Em âmbar: tarefas críticas. Semanais, mensais e anuais contam só os períodos já encerrados.</p>':'<p class="note">Nenhuma falha no período.</p>'}
   </section>
   <section class="panel"><h3>Observações recentes</h3>
    ${obs.length?`<ul class="olist">${obs.map(r=>`<li><b>${esc(r.title)}</b><q>${esc(r.obs)}</q><small>${esc(r.by)} · ${fmtDay(r.day)} ${fmtTime(r.at)}</small></li>`).join('')}</ul>`:'<p class="note">Sem observações no período.</p>'}
   </section>
  </div>`;
}

const siteZone='America/Sao_Paulo';
const allRecords=()=>Object.values(snapshots.records||{}).filter(Boolean);
let reportStart='',reportEnd='';
function reportData(start,end){
  const rows=allRecords().filter(r=>r.day>=start&&r.day<=end).sort((a,b)=>a.day.localeCompare(b.day)||a.at.localeCompare(b.at));
  const groups=new Map(S.depts.map(d=>[d.id,[d.name,0,0,0,0,0]]));
  for(const row of rows){
    if(!groups.has(row.dept))groups.set(row.dept,[deptName(row.dept),0,0,0,0,0]);
    const line=groups.get(row.dept);
    if(row.voided){line[5]++;continue}
    line[1]++;if(row.issue){line[2]++;if(!row.issue.closed)line[3]++}else if(!row.result)line[4]++;
  }
  const headers=['Departamento','Execuções válidas','Com desvio','Desvios ainda abertos','Sem classificação','Estornos'];
  const lines=[...groups.values()].sort((a,b)=>a[0].localeCompare(b[0],'pt-BR'));
  const total=['Total geral',0,0,0,0,0];for(const line of lines)for(let i=1;i<total.length;i++)total[i]+=line[i];
  return {start,end,rows,headers,lines,total};
}

async function exportExcel(rows,file,report=null){
  if(!rows.length&&!report){toast('Nenhum registro para exportar.');return}
  try{
    const XLSX=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs');
    const data=[['Data','Hora','Departamento','Tarefa','Executor','Resultado','Observação','Local','Desvio','Responsável','Prazo','Situação do desvio','Ação realizada','Estornado por','Motivo do estorno','Data e hora do estorno','Recebido no servidor']];
    const stamp=ms=>typeof ms==='number'?new Date(ms).toLocaleString('pt-BR',{timeZone:siteZone}):'';
    for(const r of rows){
      const i=r.issue||{},v=r.voided||{};
      data.push([fmtDay(r.day),fmtTime(r.at),deptName(r.dept),r.title,r.by,resultText(r),r.obs||'',i.place||'',i.description||'',i.owner?userName(i.owner):'',i.deadline?fmtDay(i.deadline):'',r.issue?(i.closed?'Encerrado':'Aberto'):'',i.closed?.note||'',v.by||'',v.reason||'',stamp(v.at),stamp(r.receivedAt)]);
    }
    const sheet=XLSX.utils.aoa_to_sheet(data);
    sheet['!autofilter']={ref:sheet['!ref']};
    sheet['!cols']=[14,10,24,42,22,20,46,24,46,22,14,20,40,22,40,24,24].map(wch=>({wch}));
    const book=XLSX.utils.book_new();
    if(report){
      const summary=XLSX.utils.aoa_to_sheet([['Relatório global',fmtDay(report.start),fmtDay(report.end)],report.headers,...report.lines,report.total]);
      summary['!cols']=report.headers.map((h,i)=>({wch:i?20:32}));
      XLSX.utils.book_append_sheet(book,summary,'Resumo global');
    }
    XLSX.utils.book_append_sheet(book,sheet,'Histórico');
    XLSX.writeFile(book,file+'.xlsx');toast('Arquivo Excel gerado.');
  }catch{toast('Não foi possível gerar o Excel. Confira a conexão e tente novamente.')}
}

function donaStats(period=14){const dep=curDept(cur()),end=today(),start=addDays(end,-(period-1)),od=opDays(dep),days=[];for(let d=start;d<=end;d=addDays(d,1))if(od.has(d))days.push(d);
  const all=S.tasks.filter(t=>t.on&&t.dept===dep),act=all.filter(t=>fq(t)==='D'),ops=S.users.filter(u=>u.role==='op'&&u.on&&u.depts.includes(dep)),done=(t,d)=>S.records.some(r=>r.task===t.id&&r.day===d);
  const past=days.filter(d=>d!==end),pct=d=>act.length?Math.round(act.filter(t=>done(t,d)).length/act.length*100):0;
  const avg=past.length?Math.round(past.reduce((a,d)=>a+pct(d),0)/past.length):0,worst=past.slice().sort((a,b)=>pct(a)-pct(b))[0];
  const miss=act.map(t=>({t,m:past.filter(d=>!done(t,d)).length})).filter(x=>x.m).sort((a,b)=>b.m-a.m);
  const critMiss=past.reduce((a,d)=>a+act.filter(t=>t.crit&&!done(t,d)).length,0);
  const byOp=ops.map(u=>{const mine=act.filter(t=>t.assign.includes(u.id)),exp=mine.length*past.length,ok=past.reduce((a,d)=>a+mine.filter(t=>done(t,d)).length,0);
    return {u,pct:exp?Math.round(ok/exp*100):null,checks:S.records.filter(r=>r.dept===dep&&r.uid===u.id&&r.day>=start).length,pend:all.filter(t=>t.assign.includes(u.id)&&!doneRec(t,end))}});
  const todayDone=all.filter(t=>doneRec(t,end)),todayPend=all.filter(t=>!doneRec(t,end));
  const obs=S.records.filter(r=>r.dept===dep&&r.obs&&r.day>=start).sort((a,b)=>a.at<b.at?1:-1);
  return {start,end,days:past.length,avg,worst,worstPct:worst?pct(worst):null,miss,critMiss,byOp,todayDone,todayPend,obs,act:all}}
function donaContext(u){const now=new Date(),day=today(),recs=S.records.filter(r=>r.day===day);
  const taskInfo=t=>{const r=doneRec(t,day),d=due(t,day);return {tarefa:t.title,periodicidade:FREQ[d.f].n,...(d.f!=='D'?{periodo_atual:perLabel(d),prazo:fmtDay(d.p.e),dias_para_o_prazo:d.left,vermelha_por_prazo_proximo:!r&&d.urgent}:{}),categoria:t.cat,critica:t.crit,instrucao:t.desc||undefined,guia:t.guia||undefined,

const DONA_DOMAIN=`CONTEXTO OPERACIONAL (gestão de resíduos e reciclagem) — explique termos assim:

- Aferir a balança = conferir se pesa certo usando um peso-padrão.
- Inspeção pré-uso do caminhão roll-on/poliguindaste: pneus, óleo, freios, cabos, ganchos, luzes.
- Saldo de caçambas: quantas vazias por tamanho e quantas em conserto.

- Não conseguiu fazer tarefa crítica: não marcar; avisar o sênior na hora. Emergência (vazamento, fogo, acidente): primeiro as pessoas — afastar, avisar sênior/brigada; registrar depois.

    return `**Tarefas por período**, ${fn}:\n- **Diária**: faz todo dia.\n- **Semanal**: uma vez por semana (de segunda a domingo).\n- **Mensal**: uma vez por mês.\n- **Anual**: uma vez por ano.\n\nNa tela, elas ficam separadas por período, com o **prazo** escrito (ex.: "até dom, 29/11"). Quando o prazo está chegando, o cartão fica **vermelho** ⏰. Depois que alguém registra, fica **verde** até começar o próximo período.\n\n${ps.length?`**As suas agora:**\n${ps.map(t=>{const d=due(t),r=doneRec(t);return `- ${t.title}: ${r?`✅ feita por ${r.by} em ${fmtDM(r.day)}`:`${untilTxt(d)}${d.urgent?' — ⏰ **'+leftTxt(d.left)+'**':''}`}`}).join('\n')}`:'Você não tem tarefa semanal, mensal ou anual agora.'}${sr?'\n\nPara mudar o período ou quando ela fica vermelha: aba **Tarefas** → **Editar** → **Periodicidade** e **Ficar vermelha faltando (dias)**.':FIM}`}
  if(!has(q,'criar','cadastr','nova tarefa','editar','excluir','desativ','estorn','errei','marquei','export','excel')){const tk=findTask(u,q);if(tk&&(tk.guia||tk.desc))return taskGuide(u,tk)}
  if(has(q,'quem e voce','quem es','o que voce faz','sua funcao')||(has(q,'ajuda','como uso','como te uso')&&q.length<25))return donaWelcome(u);
  if(sr&&has(q,'explicar o sistema','treinar','ensinar','apresentar','treinamento'))return `**Como apresentar o CheckFormation para a equipe (treino de uns 15 minutos):**\n1. **No celular de cada um**, mostre como entrar com usuário e senha (maiúscula ou minúscula tanto faz).\n2. **Explique a tela Minhas tarefas**: o número grande é quanto já fez; a etiqueta laranja é tarefa **crítica**.\n3. **Façam uma tarefa juntos**: fazer o serviço → escrever a observação se houver problema → tocar no quadrado → ficou verde com nome e hora.\n4. **Combine as 3 regras de ouro:** só marca depois de fazer; não deu para fazer, não marca e avisa; problema sempre vai na observação.\n5. **Apresente a Dona Formatione**: o botão verde no canto, as perguntas prontas, o **🔊 Ouvir** e o **Não entendi**.\n6. **Peça para cada um repetir sozinho** uma vez enquanto você olha.\n\nNa primeira semana, olhe o **Painel** todo dia e elogie quem estiver em dia. Quem tiver dificuldade, oriente a perguntar para a Dona.`;
  if(sr&&has(q,'analis','diagnost','melhor','process','gargalo','problema'))return donaAnalysis();
  if(sr&&has(q,'resumo','hoje','situacao','status','como esta','como estamos')){const s=donaStats(14);
    return `**Resumo de ${fmtDay(day)}**\n- Concluídas: **${s.todayDone.length} de ${s.act.length}** tarefas (${s.act.length?Math.round(s.todayDone.length/s.act.length*100):0}%).\n- Ainda pendentes: ${s.todayPend.length?s.todayPend.map(t=>`${t.title}${t.crit?' (**crítica**)':''} — ${respLabel(t)}`).join('; '):'nenhuma'}.\n- Conformidade média dos últimos ${s.days} dias: **${s.avg}%**. Quer dizer: em média, de cada 10 tarefas, cerca de ${Math.round(s.avg/10)} foram feitas.\n${s.todayPend.some(t=>t.crit)?'\n**O que fazer agora:** cobrar as tarefas **críticas** pendentes antes do fim do turno. Elas são de segurança e de lei ambiental.':'\n**Próximo passo:** acompanhar as pendências normais até o encerramento do turno.'}`}
  if(sr&&has(q,'quem','atencao','desempenho','operador','equipe rend','ranking')){const s=donaStats(14);
    return `**Como a equipe está nos últimos ${s.days} dias** (só conta as tarefas que são de cada pessoa):\n${s.byOp.map(o=>`- **${o.u.name}**: ${o.pct??'—'}% feito, ${o.checks} registros${o.pend.length?`. Falta hoje: ${o.pend.map(t=>t.title).join(', ')}`:'. Em dia hoje'}`).join('\n')}\n\n${s.byOp.filter(o=>o.pct!=null&&o.pct<85).map(o=>`**Atenção:** ${o.u.name} está abaixo de 85%. Antes de cobrar, converse para entender o motivo: muitas tarefas no mesmo horário, fim de turno corrido, falta de material ou dúvida sobre como fazer. Se for dúvida, peça para usar a Dona Formatione.`).join('\n')||'Ninguém abaixo de 85%. Bom sinal!'}`}
  if(has(q,'falta','pendente','o que fazer','minhas tarefas','tenho que','preciso fazer','o que eu faco'))return pend.length?
    `${fn}, hoje ainda ${pend.length>1?'faltam':'falta'} **${pend.length} tarefa${pend.length>1?'s':''}**${sr?' no checklist geral':' para você'}. Faça nesta ordem:\n${pend.map((t,i)=>`${i+1}. ${t.title}${perHint(t)}${t.crit?' — ⚠️ **crítica**: faça primeiro, é de segurança':''}${sr?` (${respLabel(t)})`:''}`).join('\n')}\n\n${sr?'Para ver quem é responsável por cada uma, abra a aba **Checklist**.':COMO_MARCAR}${sr?'':FIM}`
    :`Parabéns, ${fn}! ✅ ${sr?'Todas as tarefas de hoje já foram feitas.':'Você já fez **todas** as suas tarefas de hoje.'}\n\nNa tela, todas estão **verdes**, com o nome de quem fez e a hora.${sr?'':' Se aparecer uma tarefa nova, ela vai surgir na tela **Minhas tarefas**.'}`;
  if(has(q,'errei','errado','engano','desfaz','estorn','cancel','apagar registro','sem querer','corrigir','erro'))return sr?
    `**Para corrigir um registro feito por engano (estornar):**\n1. Abra a aba **Histórico** (ou **Checklist**).\n2. Escolha a **data** e encontre o registro.\n3. Toque em **Estornar** e depois em **Confirmar**.\n4. O registro some e a tarefa volta a ficar **pendente**.\n\n**Cuidado:** o estorno apaga o registro e o sistema ainda não guarda quem estornou. Anote o motivo em outro lugar e use só para engano.`
    :`Calma, ${fn}, isso acontece e tem solução. 🙂\n\nVocê **não consegue desfazer sozinho**. Quem desfaz é o **sênior**. É assim de propósito, para ninguém apagar um registro sem querer.\n\n**O que fazer:**\n1. Procure o sênior (ou ligue para ele).\n2. Diga **qual tarefa** você marcou por engano.\n3. Ele vai **estornar** (quer dizer: apagar o registro errado).\n4. A tarefa volta a ficar **branca**, como pendente.\n5. Quando fizer o serviço de verdade, marque de novo.${FIM}`;
  if(has(q,'como marc','como eu marc','marco','como regist','como eu regist','como da check','como faco','check','registrar','concluir','marcar')&&!has(q,'criar','nova','cadastr','export','excel','senha','observ','escrev'))return `É bem simples, ${fn}. Siga estes passos:\n1. **Primeiro faça o serviço** de verdade, no local. Só marque depois de terminar.\n2. Na tela **${sr?'Checklist':'Minhas tarefas'}**, procure a tarefa na lista.\n3. Do lado esquerdo dela tem um **quadrado branco**.\n4. Viu algum problema? **Antes** de marcar, toque na caixa **Observação** e escreva o que viu.\n5. Agora **toque no quadrado**.\n6. O quadrado fica **verde com um ✓**, e aparece o seu **nome, a data e a hora**.\n\n**Por que isso é importante?** O registro prova que o serviço foi feito, por quem e quando. Isso protege você e a empresa numa fiscalização.\n\n⚠️ **Não conseguiu fazer?** Então **não marque**. Avise o sênior.${sr?'':FIM}`;
  if(has(q,'observ','escrever','anotar','comentario','escrevo'))return sr?`**Padrão de observação para ensinar à equipe:** o quê + onde + o que foi feito.\n- Bom: "Extintor perto da balança com lacre rompido. Isolado e pedida a troca às 8h."\n- Ruim: "problema no extintor" (ninguém sabe qual nem o que foi feito).\n\nPeça para escreverem **sempre que algo não estiver normal**, mesmo com a tarefa feita. As observações aparecem no **Painel**, no quadro **Observações recentes**.`
    :`A **observação** é um **recado escrito** que fica guardado junto com a tarefa. O sênior lê depois.\n\n**Quando escrever:** sempre que alguma coisa **não estiver normal**. Por exemplo: algo quebrado, faltando, vazando ou sujo.\n\n**O que escrever (3 coisas):**\n1. **O que** você viu.\n2. **Onde** estava.\n3. **O que você fez** (por exemplo: "avisei o sênior").\n\n👉 **Exemplo bom:** "Extintor perto da balança com o lacre rompido. Avisei o sênior às 8h."\n👉 **Exemplo ruim:** "deu problema" (ninguém entende o que foi).\n\nSe estiver tudo certo, pode deixar a caixa **em branco**.${FIM}`;
  if(has(q,'critic'))return sr?`**Tarefas críticas** são as de segurança e de lei ambiental: EPI, extintores, inspeção dos caminhões, MTR e resíduos perigosos (Classe I).\n- Na tela, aparecem com a etiqueta laranja **Crítica**.\n- No **Painel**, entram nos quadros "Críticas pendentes hoje" e "Críticas não feitas".\n- Para marcar uma tarefa como crítica: aba **Tarefas** → **Editar** → **Criticidade: Crítica** → **Salvar alterações**.\n\n**Recomendação:** cobrar as críticas até o meio do turno e tratar qualquer falha como ocorrência.`
    :`Tarefa **crítica** é a que tem uma **etiqueta laranja** escrita "Crítica" do lado do nome.\n\n**O que quer dizer:** é uma tarefa ligada à **segurança das pessoas** ou à **lei ambiental**. Se ela não for feita, alguém pode se machucar ou a empresa pode levar **multa**.\n\n**O que fazer:**\n1. Faça as tarefas críticas **primeiro**, logo no começo do turno.\n2. Faça com atenção, sem pressa.\n3. Se **não der** para fazer (faltou material, equipamento quebrado), **não marque**. Avise o sênior na hora e escreva o motivo na observação.\n\n**Exemplos:** conferir EPIs, extintores, inspeção do caminhão, MTR e área de resíduos perigosos.${FIM}`;
  if(has(q,'senha','login','acesso','entrar','bloque')||(!sr&&has(q,'usuario')))return sr?`**Trocar senha de alguém:** aba **Equipe** → toque em **Editar** na pessoa → escreva a **Nova senha** → **Salvar usuário**. Passe a senha nova pessoalmente.\n**Tirar o acesso:** toque em **Bloquear** (o histórico da pessoa continua guardado). Para devolver, toque em **Liberar**.\n\nLembre a equipe: no campo Usuário, maiúscula ou minúscula tanto faz.`
    :`Se você esqueceu a senha ou não consegue entrar, ${fn}:\n1. **Não fique tentando** várias senhas diferentes.\n2. Fale com o **sênior**. Só ele pode criar uma senha nova para você.\n3. Ele vai te passar a senha nova. Guarde com você e **não conte para ninguém**.\n\n**Dicas:**\n- No campo **Usuário**, tanto faz escrever com letra maiúscula ou minúscula. Por exemplo, "op1" e "OP1" funcionam igual.\n- Para ver a senha enquanto digita, toque em **Mostrar**, do lado direito da caixa da senha.${FIM}`;
  if(sr&&has(q,'criar tarefa','nova tarefa','cadastrar tarefa','atribu','quem executa','tarefa'))return `**Para criar uma tarefa:** abra a aba **Tarefas** e preencha o formulário do alto:\n1. **Tarefa**: o nome, começando com um verbo. Ex.: "Conferir extintores do galpão 2".\n2. **Instrução / critério**: como saber que está certo. Ex.: "Lacre inteiro, ponteiro no verde, validade em dia".\n3. **Guia para a Dona Formatione**: o passo a passo completo (para que serve, como fazer, quando não marcar, exemplo de observação). É com ele que eu explico a tarefa para a equipe.\n4. **Departamento**: em qual checklist ela entra (já vem o que está selecionado no alto da tela).\n5. **Categoria**: escolha uma, ou "+ Nova categoria…".\n6. **Criticidade** e **Periodicidade**: **Crítica** para segurança e lei, **Normal** para o resto; e se é **Diária, Semanal, Mensal ou Anual** (nas não diárias, diga quantos dias antes do prazo ela fica **vermelha**).\n7. **Quem executa**: "Todos do departamento" ou marque pessoas específicas (só aparece quem tem acesso àquele departamento).\n8. Toque em **Adicionar tarefa**.\n\n**Dica:** tarefa para "todos" fica feita com o primeiro que marcar, então ninguém se sente dono. Para ter responsável claro, escolha pessoas específicas. Escreva a instrução pensando em quem tem pouca leitura: frases curtas e objetivas.`;
  if(sr&&has(q,'cadastr','colaborador','funcionario','pessoa nova','usuario'))return `**Para cadastrar uma pessoa:** aba **Equipe**:\n1. **Nome completo**: é o nome que vai aparecer em cada registro.\n2. **Usuário (login)**: curto, sem espaço. Ex.: "op4" ou "joao.silva".\n3. **Senha**: pelo menos 3 caracteres.\n4. **Perfil**: **Operador** (só vê as próprias tarefas) ou **Sênior** (vê painel e gestão).\n5. **Departamentos que pode acessar**: marque um ou mais (operador precisa de pelo menos um).\n6. Toque em **Cadastrar**.\n\nQuem tem mais de um departamento escolhe no alto da tela em qual vai preencher.\n\nDepois, na aba **Tarefas**, edite as tarefas e marque a pessoa em **Quem executa**. No primeiro dia, mostre para ela o botão da **Dona Formatione**.`;
  if(sr&&has(q,'export','csv','excel','planilha','relatorio'))return 'Abra Histórico, escolha período, colaborador, tarefa e resultado. Toque em Baixar Excel filtrado para gerar o arquivo .xlsx.';
  if(sr&&has(q,'painel','indicador','conformidade','grafico'))return `**O que o Painel mostra** (escolha 7, 14 ou 30 dias no alto):\n- **Hoje**: quantas tarefas já foram feitas de quantas existem.\n- **Críticas pendentes hoje**: tarefas de segurança/lei ainda não feitas. Deve ficar em 0.\n- **Conformidade média**: em média, quanto do checklist foi cumprido por dia.\n- **Críticas não feitas**: quantas vezes uma crítica ficou sem fazer no período.\n- **Gráfico**: uma barra por dia; **laranja** = dia abaixo de 80%.\n- **Desempenho por operador**, **Tarefas que mais ficaram sem fazer** e **Observações recentes**.\n\nQuer que eu analise esses números? Pergunte "analise o processo".`;
  if(!sr&&has(q,'painel','indicador','equipe','outros','colega','criar','cadastr','numero'))return `Essa parte é só do **sênior**, ${fn}. Ele cuida de criar tarefas, cadastrar pessoas e ver os números da equipe.\n\nNa sua tela você faz **duas coisas**:\n1. **Ver** as suas tarefas do dia.\n2. **Marcar** cada uma quando terminar.\n\nPrecisa de alguma mudança (uma tarefa nova, trocar a tarefa de pessoa)? É só **falar com o sênior**.${FIM}`;
  if(has(q,'epi','luva','oculos','botina','protetor'))return sr?`**EPI** (Equipamento de Proteção Individual): conferir no início do turno luvas, botina, óculos, protetor auricular e o que mais o risco exigir. Peça para anotarem quem estava sem EPI e a reposição feita. Falta repetida de EPI indica problema de estoque: vale criar uma tarefa semanal de conferência do almoxarifado.`
    :`**EPI** quer dizer **Equipamento de Proteção Individual**. São as coisas que **protegem o seu corpo** no trabalho.\n\n**Confira antes de começar:**\n1. **Luvas**: protegem as mãos de cortes e produtos.\n2. **Botina**: protege os pés de peso e pregos.\n3. **Óculos**: protegem os olhos de pó e respingos.\n4. **Protetor de ouvido**: protege do barulho das máquinas.\n\n**Está rasgado, quebrado ou faltando?** Peça outro ao sênior **antes** de começar e escreva na observação.\n👉 Exemplo: "Luva do Pedro rasgada. Pegou uma nova no almoxarifado."\n\n**Por que importa:** sem EPI, um acidente pequeno pode virar um machucado grave.${FIM}`;
  if(has(q,'extintor','rota de fuga','fuga'))return `O **extintor** é o **cilindro vermelho** que apaga começo de incêndio. Ele precisa estar sempre pronto.\n\n**Em cada extintor, confira 4 coisas:**\n1. **Lacre**: o plástico ou arame que prende o pino. Tem que estar **inteiro**.\n2. **Ponteiro** (o reloginho): tem que estar na **faixa verde**.\n3. **Validade**: olhe a etiqueta. Não pode estar vencida.\n4. **Caminho livre**: nada pode estar na frente (palete, caçamba, caixa).\n\nA **rota de fuga** é o caminho para sair correndo numa emergência. Também não pode ter nada atrapalhando.\n\n**Achou problema?** Escreva **qual extintor e onde** está, e ${sr?'providencie a troca':'avise o sênior'}.${sr?'':FIM}`;
  if(has(q,'mtr','manifesto'))return sr?`**MTR** (Manifesto de Transporte de Resíduos) acompanha cada transporte e é emitido no sistema do órgão ambiental **antes** da saída. A tarefa garante que toda coleta do dia tenha MTR conferido: gerador, transportador, destino, tipo e quantidade. Divergência = **não liberar** a saída e registrar na observação. Confirme as exigências da sua unidade com o responsável técnico.`
    :`**MTR** é o **Manifesto de Transporte de Resíduos**. Em palavras simples: é o **documento que acompanha o lixo no caminhão**. Ele diz o que está sendo levado, de onde vem e para onde vai.\n\n**Por que importa:** sem o MTR certo, o caminhão **não pode sair**. Se sair, a empresa pode levar **multa**.\n\n**O que fazer nessa tarefa:**\n1. Confira se **cada coleta do dia** tem o seu MTR.\n2. Veja se o que está escrito **bate com a carga** (tipo de resíduo e quantidade).\n3. Tudo certo? Marque a tarefa.\n4. Algo diferente? **Não libere a saída**. Escreva na observação e chame o sênior.${FIM}`;
  if(has(q,'classe i','perigos','tambor','contencao','classe 1','quimic','oleo'))return `**Classe I** são os **resíduos perigosos**: óleo, tinta, solvente, produtos químicos. Eles podem fazer mal à saúde e à natureza.\n\n**O que conferir na área deles:**\n1. A **bacia de contenção** (a "piscina" amarela embaixo dos tambores) tem que estar **seca**.\n2. Os **tambores** têm que estar **fechados** e com **etiqueta**.\n3. Olhe se **nada está vazando** no chão.\n4. O **kit de emergência** (mantas, areia, pá) tem que estar **completo**.\n\n**Regra de ouro:** resíduo perigoso **nunca** se mistura com o lixo comum.\n\n⚠️ **Viu vazamento?** Use luva e óculos, afaste as pessoas e **avise o sênior na hora**.${sr?'':FIM}`;
  if(/\bcor(es)?\b/.test(q)||has(q,'segreg','coleta seletiva','lixeira','coletor','separar'))return `Cada **cor de coletor** (lixeira) é para um material:\n- 🔵 **Azul**: papel e papelão\n- 🔴 **Vermelho**: plástico\n- 🟡 **Amarelo**: metal (latas, ferro)\n- 🟢 **Verde**: vidro\n\n**Por que separar:** material separado do jeito certo pode ser **reciclado**. Misturado, vira lixo comum e vai para o aterro.\n\n**Na triagem:** cada material vai para a sua **baia** (o espaço separado com placa). Viu material no lugar errado? Coloque no lugar certo ou avise. Resíduo **perigoso nunca** vai junto.${sr?'':FIM}`;
  if(has(q,'balanca','aferi','peso'))return `**Aferir a balança** quer dizer **conferir se ela está pesando certo**.\n\n**Como fazer:**\n1. Deixe a balança **vazia** e veja se marca **zero**.\n2. Coloque o **peso-padrão** (o peso de teste, que já tem o valor conhecido).\n3. Compare: o número da balança tem que ser **igual** ao do peso-padrão, ou bem perto.\n4. Escreva o resultado na observação.\n👉 Exemplo: "Peso-padrão 1.000 kg. A balança marcou 1.010 kg."\n5. Diferença grande? ${sr?'Chame o técnico e evite pesagens oficiais até corrigir.':'**Avise o sênior** antes de pesar as cargas.'}\n\n**Por que importa:** balança errada faz a empresa **cobrar ou pagar errado**.${sr?'':FIM}`;
  if(has(q,'cacamba','roll-on','caminhao','veiculo','pneu','inspec'))return `**Inspeção do caminhão** é olhar se ele está seguro **antes** de sair.\n\n**Confira:**\n1. **Pneus**: cheios, sem corte e sem bolha.\n2. **Óleo**: sem mancha de óleo embaixo do caminhão.\n3. **Freios**: funcionando.\n4. **Cabos e ganchos** do braço (roll-on): sem fio partido e sem trinca.\n5. **Luzes e setas**: acendendo.\n\n⚠️ Achou problema de segurança? O caminhão **não sai**. Escreva o que viu e avise ${sr?'a manutenção':'o sênior'}.\n\n**Saldo de caçambas:** é **contar** quantas caçambas vazias estão no pátio, de cada tamanho, e quantas estão no conserto. Escreva os números na observação.${sr?'':FIM}`;
  if(has(q,'limpeza','organiza','galpao'))return `**Limpeza e organização do galpão** no fim do turno:\n1. **Varra** o chão e recolha os restos de material.\n2. Coloque cada material na sua **baia** certa.\n3. Deixe **corredores e saídas livres**.\n4. Guarde as ferramentas no lugar.\n\n**Por que importa:** galpão sujo e bagunçado causa **tropeços, cortes e incêndio**.\n\nNão deu tempo ou faltou gente? **Não marque**: escreva o motivo e avise ${sr?'a equipe do próximo turno':'o sênior'}.${sr?'':FIM}`;
  if(has(q,'obrigad','valeu','show','entendi'))return `Que bom, ${fn}! Conte comigo sempre que precisar. Bom trabalho! 💚`;
  return sr?`Não encontrei isso nas respostas que eu já tenho prontas, ${fn}. Posso ajudar com: **resumo de hoje**, **análise do processo**, **quem precisa de atenção**, como **criar tarefas**, **cadastrar pessoas**, **estornar** e **exportar para o Excel**.`
    :`Desculpe, ${fn}, não entendi direito. 😅\n\nTente perguntar de outro jeito, com palavras simples. Por exemplo:\n- "O que falta eu fazer hoje?"\n- "Como eu marco uma tarefa?"\n- "O que é MTR?"\n- "O que eu escrevo na observação?"\n\nSe preferir, chame o **sênior** para te ajudar na tela.`}
function donaAnalysis(){const s=donaStats(14),late=s.miss.filter(x=>x.t.cat==='Encerramento'),crit=s.miss.filter(x=>x.t.crit),low=s.byOp.filter(o=>o.pct!=null&&o.pct<85);
  const lm=late.reduce((x,y)=>x+y.m,0),tm=s.miss.reduce((x,y)=>x+y.m,0),oc={};s.obs.forEach(r=>oc[r.title]=(oc[r.title]||0)+1);const topObs=Object.entries(oc).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return `**Análise do processo: últimos ${s.days} dias de operação**\n- **Conformidade média: ${s.avg}%.** Quer dizer que, em média, de cada 10 tarefas, cerca de ${Math.round(s.avg/10)} foram feitas.${s.worst?` O pior dia foi ${fmtDay(s.worst)}, com ${s.worstPct}%.`:''}\n- **Críticas não feitas: ${s.critMiss}.**${crit.length?` São tarefas de segurança e lei: ${crit.map(x=>`${x.t.title} (${x.m}x)`).join('; ')}.`:''}\n- **Tarefas que mais falharam:** ${s.miss.slice(0,3).map(x=>`${x.t.title} (${x.m}x)`).join(', ')||'nenhuma'}.\n${lm&&lm>=tm*.35?`- **${lm} de ${tm} falhas** são no **Encerramento**. Sinal de fim de turno corrido.\n`:''}${low.length?`- **Abaixo de 85%:** ${low.map(o=>`${o.u.name} (${o.pct}%)`).join(', ')}.\n`:''}${topObs.length?`- **Mais observações** (onde mais aparece problema): ${topObs.map(([t,n])=>`${t} (${n})`).join('; ')}.\n`:''}
**O que fazer, por ordem de prioridade**\n1. Cobrar as tarefas **críticas** até o meio do turno. Qualquer crítica não feita deve virar uma ocorrência conversada com a equipe.\n2. ${low.length?`Conversar com ${low.map(o=>first(o.u.name)).join(', ')} para entender o motivo (carga de trabalho, horário ou dúvida) e ajustar a distribuição.`:'Manter a distribuição atual das tarefas.'}\n3. Transformar observações repetidas em **ação corretiva**: trocar o equipamento, comprar o material, corrigir o local.\n4. Melhorias no sistema que eu sugiro: **horário-limite** por tarefa, **observação obrigatória** quando houver problema, **foto** como prova e **registro de quem estornou**.`}

/* --- voz --- */
const plainText=t=>t.replace(/\*\*(.+?)\*\*/g,'$1').replace(/[🔵🔴🟡🟢✅⚠️👉💚😅🙂🧠♻️]/gu,'').replace(/^\s*-\s+/gm,'').replace(/\n{2,}/g,'\n');
function donaSpeak(i){const m=dona.msgs.length?dona.msgs[i]:{t:donaWelcome(cur())};if(!m)return;
  if(speakingIdx===i){speakingIdx=-1;try{ttsNs?ttsNs.stop():speechSynthesis.cancel()}catch(e){}donaActs();return}
  speakingIdx=i;donaActs();const txt=plainText(m.t);
  if(ttsNs){const lines=txt.split('\n').filter(Boolean).map(l=>({text:l.slice(0,1900),language:'pt-BR'}));ttsNs.speak(lines,{rate:.92}).catch(()=>{speakingIdx=-1;donaActs()});return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=.95;const v=speechSynthesis.getVoices().find(v=>/pt[-_]BR/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{speakingIdx=-1;donaActs()};speechSynthesis.speak(u)}catch(e){speakingIdx=-1;donaActs()}}

/* --- interface --- */
const mdLite=t=>{const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',list=null;
  for(const l of lines){const ul=l.match(/^\s*[-•]\s+(.*)/),ol=l.match(/^\s*\d+[.)]\s+(.*)/);const kind=ul?'ul':ol?'ol':null;
    if(kind!==list){if(list)h+=`</${list}>`;if(kind)h+=`<${kind}>`;list=kind}
    if(kind)h+=`<li>${(ul||ol)[1]}</li>`;else if(l.trim())h+=`<p>${l}</p>`}
  if(list)h+=`</${list}>`;return h};
const donaChips=u=>u.role==='senior'?['Resumo de hoje','O que está vencendo?','Analise o processo','Quem precisa de atenção?','Como criar uma tarefa?','Como cadastrar uma pessoa?','Como exportar para o Excel?','Como explicar o sistema para a equipe?']
  :['O que falta eu fazer hoje?','O que está vencendo?','Me explique a próxima tarefa','Como eu marco uma tarefa?','O que eu escrevo na observação?','Marquei errado, e agora?','O que é tarefa crítica?','O que é MTR?','O que é EPI?','Esqueci minha senha'];
function donaWelcome(u){const fn=first(u.name);return u.role==='senior'?`${greet()}, ${fn}! Eu sou a **Dona Formatione** 🧠♻️\n\nPosso:\n- resumir o dia;\n- analisar o processo com os números do checklist;\n- mostrar quem precisa de atenção;\n- explicar, passo a passo, como configurar tarefas, equipe e relatórios.\n\nToque numa pergunta pronta aqui embaixo ou escreva a sua.`
  :`${greet()}, ${fn}! Eu sou a **Dona Formatione** 🧠♻️, a sua ajudante aqui no sistema.\n\nEu explico tudo com calma, passo a passo.\n\n**Você pode falar comigo assim:**\n1. Toque numa das **perguntas prontas** aqui embaixo.\n2. Ou **escreva** a sua dúvida do seu jeito e toque na setinha **➤**.${dictNs?'\n3. Ou toque no **microfone 🎤** e fale.':''}\n\n👉 Quer **ouvir** a resposta? Toque em **🔊 Ouvir**.\n👉 Não entendeu? Toque em **Não entendi** que eu explico de outro jeito.`}
function donaSync(force){const u=cur(),box=$('#dona');if(!u){box.innerHTML='';delete box.dataset.uid;dona.uid=null;return}donaLoad(u);if(box.dataset.uid===u.id&&!force)return;box.dataset.uid=u.id;
  const sr=u.role==='senior',ai=sampleNs?'IA conectada':sampleTried?'Modo offline · respostas prontas':'',big=ls.get('cf-dona-big',!sr);
  box.innerHTML=`<button type="button" class="dfab" data-dona="open" aria-label="Abrir a Dona Formatione, ajuda" ${dona.open?'hidden':''}><span class="dav">${DONA_ICON('f')}</span><span class="dlbl">Dúvidas? <b>Fale com a Dona</b></span></button>
  <section class="dpanel${big?' dbig':''}" role="dialog" aria-label="Dona Formatione" ${dona.open?'':'hidden'}>
   <header class="dhead"><span class="dav lg">${DONA_ICON('h')}</span><div><b>Dona Formatione</b><small>${sr?'Modo sênior · respostas completas':'Modo equipe · explicações passo a passo'}</small></div>
    <button type="button" class="dx" data-dona="big" title="Letra maior ou menor" aria-label="Letra maior ou menor">A+</button><button type="button" class="dx" data-dona="clear" title="Começar conversa nova" aria-label="Começar conversa nova">↺</button><button type="button" class="dx" data-dona="close" aria-label="Fechar">✕</button></header>
   <div class="dmsgs" id="dmsgs" aria-live="polite"></div>
   <div class="dchips">${donaChips(u).map(c=>`<button type="button" data-ask="${esc(c)}">${esc(c)}</button>`).join('')}</div>
   <form class="dform" id="dform">${dictNs?`<button type="button" class="dmic" id="dmic" data-dona="mic" aria-label="Falar a pergunta" aria-pressed="false">🎤</button>`:''}<textarea id="dq" rows="1" maxlength="600" placeholder="Escreva sua dúvida aqui…" aria-label="Sua pergunta"></textarea><button class="btn" aria-label="Enviar pergunta">➤</button></form>
   <p class="dstat" id="dstat">${ai}</p></section>`;
  donaMsgs()}
function donaActs(){document.querySelectorAll('#dmsgs [data-say]').forEach(b=>{const on=+b.dataset.say===speakingIdx;b.textContent=on?'⏹ Parar':'🔊 Ouvir';b.setAttribute('aria-pressed',String(on))})}
function donaMsgs(){const el=$('#dmsgs'),u=cur();if(!el||!u)return;const ms=dona.msgs.length?dona.msgs:[{r:'a',t:donaWelcome(u)}],last=ms.length-1;
  el.innerHTML=ms.map((m,i)=>`<div class="dm ${m.r}">${m.r==='a'?`<span class="dav sm">${DONA_ICON('m'+i)}</span>`:''}<div class="dbw"><div class="db">${m.t?mdLite(m.t):'<span class="dots" aria-label="Dona está escrevendo"><i></i><i></i><i></i></span>'}</div>
   ${m.r==='a'&&m.t&&!(dona.busy&&i===last)?`<div class="dacts">${hasVoice()?`<button type="button" data-say="${i}">🔊 Ouvir</button>`:''}${i===last&&dona.msgs.length?`<button type="button" data-ask="Não entendi, explica de um jeito mais fácil">🤔 Não entendi</button>`:''}</div>`:''}</div></div>`).join('');
  donaActs();el.scrollTop=el.scrollHeight}
async function donaAsk(q){const u=cur();if(!u||dona.busy||!q.trim())return;q=q.trim();dona.busy=true;dona.msgs.push({r:'u',t:q});const a={r:'a',t:''};dona.msgs.push(a);donaMsgs();
  const s=await getSample();const st=$('#dstat');
  if(s){try{donaAbort=new AbortController();if(st)st.textContent='A Dona está pensando…';
      const res=await s(donaPrompt(u,q),{cache:false,signal:donaAbort.signal,modelTier:'default',onText:({text})=>{a.t=text==='Thinking...'?'':text;const b=$('#dmsgs .dm:last-child .db');if(b&&a.t){b.innerHTML=mdLite(a.t);$('#dmsgs').scrollTop=1e9}}});
      a.t=(res&&res.text)||a.t||donaLocal(u,q);if(st)st.textContent='IA conectada'}
    catch(e){const c=e&&e.code;if(c==='not_granted'){sampleNs=null}a.t=(c==='rate_limited'?'Muitas perguntas seguidas. Enquanto isso, respondo com o que já sei:\n\n':'')+donaLocal(u,q);if(st)st.textContent=sampleNs?'IA conectada':'Modo offline · respostas prontas'}}
  else{await new Promise(r=>setTimeout(r,350));a.t=donaLocal(u,q);if(st)st.textContent='Modo offline · respostas prontas'}
  dona.busy=false;donaSave(u);donaMsgs()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dona],[data-ask],[data-say]');if(!b)return;const u=cur();if(!u)return;
  if(b.dataset.ask){donaAsk(b.dataset.ask);return}
  if(b.dataset.say!=null){donaSpeak(+b.dataset.say);return}
  const a=b.dataset.dona;
  if(a==='mic'){if(!dictNs)return;const t=$('#dq');if(dictOn){dictNs.stop().catch(()=>{});return}t.dataset.voice='1';dictNs.start().catch(err=>{if(err&&err.code==='not_granted'){dictNs=null;b.remove()}});return}
  if(a==='open'||a==='close'){dona.open=a==='open';donaSave(u);$('.dfab').hidden=dona.open;$('.dpanel').hidden=!dona.open;if(dona.open){donaMsgs();setTimeout(()=>$('#dq')?.focus(),50)}else if(speakingIdx>=0)donaSpeak(speakingIdx)}
  else if(a==='big'){const p=$('.dpanel');p.classList.toggle('dbig');ls.set('cf-dona-big',p.classList.contains('dbig'))}
  else if(a==='clear'){if(donaAbort)donaAbort.abort();if(speakingIdx>=0)donaSpeak(speakingIdx);dona.msgs=[];dona.busy=false;donaSave(u);donaMsgs()}});
document.addEventListener('keydown',e=>{if(e.target.id==='dq'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value='';donaAsk(v)}
  if(e.key==='Escape'&&dona.open&&cur()&&$('.dpanel')){dona.open=false;donaSave(cur());$('.dfab').hidden=false;$('.dpanel').hidden=true}});
document.addEventListener('submit',e=>{if(e.target.id!=='dform')return;e.preventDefault();e.stopImmediatePropagation();const t=$('#dq'),v=t.value;t.value='';donaAsk(v)},true);

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act],[data-v],[data-dept],[data-check],[data-undo],[data-f],[data-period],[data-edit],[data-tog],[data-del],[data-uedit],[data-utog],[data-dedit],[data-dtog],[data-ddel],[data-day]');if(!el)return;
  const d=el.dataset,u=cur();
  if(d.act==='theme')toggleTheme();
  else if(d.act==='showpw'){const p=$('#lgP');p.type=p.type==='password'?'text':'password';el.textContent=p.type==='password'?'Mostrar':'Ocultar'}
  else if(d.act==='logout'){if(auth){await authApi.signOut(auth);location.reload()}}
  else if(d.v){view=d.v;ls.set('cf-view-'+u.role,view);editTask=editUser=editDept=null;render();scrollTo(0,0)}
  else if(d.dept){setDept(u,d.dept);histTask='';histOp='';filter='Todas';editTask=null;render()}
  else if(d.check){if(el.getAttribute('aria-disabled'))return;check(+d.check)}
  else if(d.undo)undo(+d.undo);
  else if(d.f){filter=d.f;render()}
  else if(d.period){period=+d.period;render()}
  else if(!isSr())return;
  else if(d.edit){editTask=+d.edit;render();scrollTo({top:0,behavior:'smooth'})}
  else if(d.tog){const t=S.tasks.find(x=>x.id===+d.tog);t.on=!t.on;await save()}
  else if(d.del){const t=S.tasks.find(x=>x.id===+d.del);if(await ask('Excluir tarefa?',`“${t.title}” sai do checklist. Os registros antigos continuam no histórico.`)){S.tasks=S.tasks.filter(x=>x!==t);await save()}}
  else if(d.uedit){editUser=d.uedit;render();scrollTo({top:0,behavior:'smooth'})}
  else if(d.utog){const x=S.users.find(y=>y.id===d.utog);x.on=!x.on;toast(x.on?'Acesso liberado':'Acesso bloqueado');await save()}
  else if(d.day){e.preventDefault();histDay=d.day;render()}
  else if(d.act==='cancelTask'){editTask=null;render()}
  else if(d.act==='cancelUser'){editUser=null;render()}
  else if(d.act==='cancelDept'){editDept=null;render()}
  else if(d.dedit){editDept=d.dedit;render();scrollTo({top:0,behavior:'smooth'})}
  else if(d.dtog){const x=S.depts.find(y=>y.id===d.dtog);
    if(x.on&&S.depts.filter(y=>y.on).length===1){toast('Mantenha pelo menos um departamento ativo');return}
    if(x.on&&!await ask('Desativar departamento?',`“${x.name}” some da tela de todos e deixa de contar no painel. Tarefas, acessos e histórico ficam guardados e voltam ao reativar.`))return;
    x.on=!x.on;toast(x.on?'Departamento ativado':'Departamento desativado');await save()}
  else if(d.ddel){const x=S.depts.find(y=>y.id===d.ddel);
    if(S.depts.length===1){toast('É preciso ter pelo menos um departamento');return}
    if(S.tasks.some(t=>t.dept===x.id)||S.records.some(r=>r.dept===x.id)){await ask('Não é possível excluir',`“${x.name}” tem tarefas ou histórico de registros. Para tirá-lo de uso sem perder o histórico, use Desativar.`);return}
    if(await ask('Excluir departamento?',`“${x.name}” será removido e sai do cadastro de quem tinha acesso.`)){S.depts=S.depts.filter(y=>y!==x);S.users.forEach(w=>w.depts=w.depts.filter(i=>i!==x.id));if(editDept===x.id)editDept=null;await save()}}
  else if(d.act==='globalExcel'&&reportStart){const report=reportData(reportStart,reportEnd);await exportExcel(report.rows,'CheckFormation_global_'+reportStart+'_'+reportEnd,report)}
  else if(d.act==='xlsFiltered')await exportExcel(historyRows(),'CheckFormation_'+histDay+'_'+(histEnd||histDay));
  else if(d.act==='xlsAll'){const rows=allRecords();if(await ask('Exportar todos os departamentos?',rows.length+' registros de todas as datas.'))await exportExcel(rows.sort((a,b)=>a.at.localeCompare(b.at)),'CheckFormation_completo')}
});
document.addEventListener('input',e=>{const id=e.target.dataset?.draft;if(id){const dr=ls.get('cf-drafts',{});dr[id]=e.target.value;ls.set('cf-drafts',dr)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='hDay'){histDay=t.value||today();if(histEnd<histDay)histEnd=histDay;render()}
  if(t.id==='hEnd'){histEnd=t.value>=histDay?t.value:histDay;render()}
  if(t.id==='hTask'){histTask=t.value;render()}
  if(t.id==='hResult'){histResult=t.value;render()}
  if(t.id==='hOp'){histOp=t.value;render()}
  if(t.id==='tCat')$('#newCatBox').hidden=t.value!=='__new';
  if(t.id==='tFreq'){$('#warnBox').hidden=t.value==='D';$('#tWarn').value=FREQ[t.value].warn}
  if(t.id==='tDept')$('#asgBox').innerHTML=asgHtml(t.value,[...document.querySelectorAll('[name=asg]:checked')].map(c=>c.value));
  if(t.id==='uRole'){const sr=t.value==='senior';$('#udepBox').hidden=sr;$('#udepSr').hidden=!sr}
  if(t.id==='asgAll'&&t.checked)document.querySelectorAll('[name=asg]').forEach(c=>c.checked=false);
  if(t.name==='asg'&&t.checked)$('#asgAll').checked=false;
});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(['fLogin','fRecover'].includes(f.id)){await submitAccess(f);return;}
  if(!isSr()){toast('Sessão expirada');render();return}
  if(f.id==='fGlobal'){
    const start=f.elements.start.value,end=f.elements.end.value;
    if(!start||!end||start>end){f.querySelector('[role=status]').textContent='A data final deve ser igual ou posterior à inicial.';return}
    reportStart=start;reportEnd=end;render();return;
  }
  if(f.id==='fTask'){let cat=$('#tCat').value;if(cat==='__new'){cat=$('#tNewCat').value.trim();if(!cat){toast('Informe a nova categoria');return}if(!S.cats.includes(cat))S.cats.push(cat)}
    const dept=$('#tDept').value;if(!S.depts.some(x=>x.id===dept))return;
    const assign=[...document.querySelectorAll('[name=asg]:checked')].map(c=>c.value).filter(id=>S.users.some(x=>x.id===id&&x.depts.includes(dept)));
    const v={title:$('#tTitle').value.trim(),desc:$('#tDesc').value.trim(),guia:$('#tGuia').value.trim(),cat,crit:$('#tCrit').value==='1',dept,assign};v.freq=FREQ[$('#tFreq').value]?$('#tFreq').value:'D';if(v.freq!=='D')v.warn=Math.max(0,Math.min(366,Math.round(+$('#tWarn').value||0)));if(!v.title)return;
    if(editTask)Object.assign(S.tasks.find(t=>t.id===editTask),v);else S.tasks.push({id:nextId(),...v,on:true});
    toast((editTask?'Tarefa atualizada':'Tarefa adicionada')+(dept!==curDept(cur())?' em '+deptName(dept):''));editTask=null;await save()}
  if(f.id==='fDept'){const name=$('#dName').value.trim();if(!name)return;
    if(S.depts.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==editDept)){$('#dErr').textContent='Já existe um departamento com esse nome.';return}
    if(editDept){S.depts.find(x=>x.id===editDept).name=name;toast('Departamento atualizado')}
    else{S.depts.push({id:'d'+(nextId()),name,on:true});toast('Departamento criado')}
    editDept=null;await save()}
  if(f.id==='fUser'){
    const profile=editUser?S.users.find(u=>u.id===editUser):null;
    const login=normalized($('#uLogin').value),name=$('#uName').value.trim(),password=$('#uPassword').value,email=normalized($('#uEmail').value);
    const role=profile?.role||'op', depts=[...f.querySelectorAll('[name=udep]:checked')].map(c=>c.value);
    const error=$('#uErr');
    if(!name || !/^[a-z0-9._-]{2,30}$/.test(login)){error.textContent='Informe o nome e um login de 2 a 30 caracteres, sem espaços.';return}
    if((login==='adm' && (!profile || keyFor('users',profile.id)!=='0')) || S.users.some(u=>u.id!==profile?.id && (normalized(u.login)===login))){error.textContent='Este login já está em uso.';return}
    if((!profile?.authUid || password || email!==profile?.email) && password.length<6){error.textContent='Informe uma senha de pelo menos 6 caracteres para criar ou alterar o e-mail da conta.';return}
    if(role==='op'&&!depts.length){error.textContent='Selecione ao menos um departamento.';return}
    const id=profile?.id||'u'+nextId(), key=profile?keyFor('users',id):'id_'+id;
    if(busy || !connected){error.textContent='Aguarde a conexão para salvar.';return}
    busy=true; f.inert=true; error.textContent='Salvando acesso…';
    try{
      await setAccess(profile,key,login,password,{id,name,email,role,depts,on:profile?.on??true});
      editUser=null;toast('Acesso salvo.');
      if(password && profile?.id===cur()?.id){await authApi.signOut(auth);location.reload();return;}
    }catch{error.textContent='Não foi possível salvar. Confira o login, a senha e a conexão.';return}
    finally{busy=false;f.inert=false}
    refreshCloud();render();
  }
});

applyTheme();render();
connectCloud().catch(()=>{ready=false;signedProfile=null;accessMessage='Não foi possível abrir os dados. Confira a conexão e atualize a página.';render()});
